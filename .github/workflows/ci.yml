name: CI

# 알림 워크플로우와 달리 pull_request를 사용:
# PR에 올라온 코드를 실제로 체크아웃해서 검사해야 하므로
# pull_request_target(=base 브랜치 코드 실행)을 쓰면 안 된다.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 같은 브랜치에 새 커밋이 올라오면 이전 실행은 취소한다
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # package.json의 packageManager 필드에서 pnpm 버전을 읽어온다
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # lockfile과 package.json이 어긋나면 설치 자체를 실패시킨다
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # next build가 타입 검사까지 함께 수행한다
      - name: Build
        run: pnpm build
